# Publishes the site to GitHub Pages after a change lands on main.
# scripts/build_site.mjs writes the pages into _site so the README and
# this workflow are not part of the public site.

name: Publish site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # A commit made by the trends job uses the Actions token, and that
  # kind of push does not start this workflow by itself. This link does.
  workflow_run:
    workflows: ["Update trends"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Ask GitHub to turn Pages on if it is off, and to use Actions
          # as the source. The token Actions provides cannot create a Pages
          # site, so the first time this still needs a person:
          # Settings → Pages → Build and deployment → Source: GitHub Actions.
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Writes the episode pages from data/episodes.json into _site, and
      # copies the fonts, the tools page and the trend data next to them.
      - name: Build the site
        run: node scripts/build_site.mjs

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
